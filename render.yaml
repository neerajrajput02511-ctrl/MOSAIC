services:
  - type: web
    name: mosaic-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PROJECT_NAME
        value: "WEATHERFUSION AI"
      - key: APP_ENV
        value: "production"
      - key: ENVIRONMENT
        value: "production"
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:///./weatherfusion.db"
      - key: ECMWF_API_KEY
        sync: false
      - key: ECMWF_API_EMAIL
        sync: false
      - key: MOSDAC_USERNAME
        sync: false
      - key: MOSDAC_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
